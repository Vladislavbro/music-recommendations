[project]
name = "grouprec"
version = "0.1.0"
description = "Learned group aggregators over a frozen per-user scorer on YAMBDA"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "tqdm",
]

[project.optional-dependencies]
research = [
    "datasets>=2.18",
    "huggingface_hub>=0.23",
    "matplotlib",
    "scikit-learn",
    "ipykernel",
    "jupyter",
]
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]
dev = [
    "pytest",
    "ruff",
    "nbstripout",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research/grouprec"]

[tool.pytest.ini_options]
testpaths = ["research/tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["references", "artifacts", "research/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
